<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrar una falta</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --fg: #17202a; --muted: #56616c; --line: #cdd5dc;
    --accent: #1d6a85; --accent-soft: #e2f0f5; --accent-fg: #fff; --error: #b3261e; --ok: #1e7b3a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #10161c; --card: #18212a; --fg: #e3e9ee; --muted: #9aa7b3; --line: #33414e;
      --accent: #5bb4d3; --accent-soft: #173643; --accent-fg: #0c1419; --error: #f2877e; --ok: #74cf8f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 24px; margin: 4px 0 16px; }
  fieldset, .campo { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0 0 12px; min-width: 0; }
  legend, .campo > label { float: left; width: 100%; padding: 0; margin-bottom: 8px; font-weight: 600; }
  legend + *, .campo > label + * { clear: both; }
  /* Toda opción es una ficha: varias por línea, así 24 personas no son un scroll largo. */
  .fichas { display: flex; flex-wrap: wrap; gap: 8px; }
  .ficha { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px 0 10px;
    border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
  .ficha input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
  .ficha:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .fuerte { font-weight: 600; }
  .grupo { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
  .fila { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .fila > .ficha, .plegar { white-space: nowrap; }
  .plegar { font: inherit; font-size: 15px; color: var(--accent); background: none; border: 0; min-height: 44px; padding: 0 4px; cursor: pointer; }
  .plegar::after { content: " ▾"; }
  .plegar[aria-expanded="true"]::after { content: " ▴"; }
  /* Los nombres solo se despliegan si hace falta elegir uno por uno; en dos columnas en el teléfono. */
  .nombres { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .nombres[hidden] { display: none; }
  .nombres .ficha { border-radius: 10px; font-size: 15px; padding: 6px 10px; }
  @media (min-width: 560px) { .nombres { grid-template-columns: repeat(3, 1fr); } }
  .ayuda { color: var(--muted); font-size: 15px; margin: 8px 0 0; }
  #cuantos { margin: 0 0 10px; color: var(--fg); font-weight: 600; }
  textarea { display: block; width: 100%; min-height: 88px; font: inherit; color: inherit; background: transparent; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
  .fecha { display: flex; flex-wrap: wrap; gap: 8px; }
  .fecha button, .fecha input { font: inherit; color: inherit; background: transparent; min-height: 44px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; }
  .fecha button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .principal { width: 100%; min-height: 52px; font: inherit; font-weight: 600; color: var(--accent-fg); background: var(--accent); border: 0; border-radius: 10px; }
  .principal:disabled { opacity: .6; }
  #mensaje { min-height: 1.4em; margin: 0 0 12px; }
  .error { color: var(--error); }
  .ok { color: var(--ok); font-weight: 600; font-size: 22px; }
</style>
</head>
<body>
<main>
  <h1>Registrar una falta</h1>
  <p id="cargando">Cargando…</p>

  <form id="falta" hidden>
    <fieldset>
      <legend>Tipo de falta</legend>
      <div class="fichas" id="tipos"></div>
    </fieldset>
    <fieldset>
      <legend>Gravedad</legend>
      <div class="fichas" id="gravedades"></div>
    </fieldset>
    <fieldset id="afecta">
      <legend>¿A quién afecta?</legend>
      <div>
        <p id="cuantos" aria-live="polite"></p>
        <label class="ficha fuerte"><input type="checkbox" id="todos"> Todos</label>
        <div id="grupos"></div>
      </div>
    </fieldset>
    <div class="campo">
      <label for="detalle">¿Qué pasó?</label>
      <textarea id="detalle" maxlength="2000" required></textarea>
    </div>
    <fieldset>
      <legend>Fecha de la falta</legend>
      <div class="fecha">
        <button type="button" data-dia="hoy">Hoy</button>
        <button type="button" data-dia="ayer">Ayer</button>
        <input type="date" id="fecha" aria-label="Otra fecha" required>
      </div>
    </fieldset>
    <p id="mensaje" role="status" aria-live="polite"></p>
    <button class="principal" id="enviar" type="submit">Registrar falta</button>
  </form>

  <div id="listo" hidden>
    <p class="ok" role="status">Falta registrada.</p>
    <button class="principal" id="otra" type="button">Registrar otra</button>
  </div>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const casillas = () => [...document.querySelectorAll('input[name=persona]')];
  let datos, id, inicio;

  function ficha(tipo, nombre, valor, texto = valor) {
    const label = document.createElement('label');
    label.className = 'ficha';
    const input = document.createElement('input');
    Object.assign(input, { type: tipo, name: nombre, value: valor, required: tipo === 'radio' });
    label.append(input, ' ' + texto); // texto, nunca HTML: los nombres vienen de la hoja
    return label;
  }

  // Un bloque por rol, en el orden de la hoja: la casilla del rol marca o desmarca a todo el grupo,
  // y el botón despliega los nombres para elegir uno por uno.
  function grupo(rol, nombres) {
    const titulo = ficha('checkbox', '', rol, `${rol} · ${nombres.length}`);
    titulo.classList.add('fuerte');
    titulo.querySelector('input').dataset.grupo = rol;
    const lista = document.createElement('div');
    lista.className = 'nombres';
    lista.hidden = true;
    lista.append(...nombres.map((n) => {
      const f = ficha('checkbox', 'persona', n);
      f.querySelector('input').dataset.de = rol;
      return f;
    }));
    const boton = document.createElement('button');
    Object.assign(boton, { type: 'button', className: 'plegar' });
    boton.dataset.cuenta = rol;
    boton.setAttribute('aria-expanded', 'false');
    boton.addEventListener('click', () => {
      lista.hidden = !lista.hidden;
      boton.setAttribute('aria-expanded', !lista.hidden);
    });
    const fila = document.createElement('div');
    fila.className = 'fila';
    fila.append(titulo, boton);
    const div = document.createElement('div');
    div.className = 'grupo';
    div.append(fila, lista);
    return div;
  }

  function sincronizar() {
    const todas = casillas();
    const marcadas = todas.filter((c) => c.checked).length;
    document.querySelectorAll('[data-grupo]').forEach((g) => {
      g.checked = todas.filter((c) => c.dataset.de === g.dataset.grupo).every((c) => c.checked);
    });
    document.querySelectorAll('[data-cuenta]').forEach((b) => {
      const suyas = todas.filter((c) => c.dataset.de === b.dataset.cuenta);
      b.textContent = `${suyas.filter((c) => c.checked).length} de ${suyas.length}`;
    });
    $('#todos').checked = todas.length > 0 && marcadas === todas.length;
    $('#cuantos').textContent = !marcadas ? 'Todavía no marcaste a nadie.'
      : marcadas === todas.length ? `Afecta a todos (${marcadas}).`
      : `Afecta a ${marcadas} ${marcadas === 1 ? 'persona' : 'personas'}.`;
  }

  function mensaje(texto, error) {
    $('#mensaje').textContent = texto;
    $('#mensaje').className = error ? 'error' : '';
  }

  function marcarDia() {
    document.querySelectorAll('[data-dia]').forEach((b) => b.setAttribute('aria-pressed', $('#fecha').value === datos[b.dataset.dia]));
  }

  // Cada falta nueva lleva su propio id; un reintento usa el mismo, así el servidor no la guarda dos veces.
  function nueva() {
    $('#falta').reset();
    document.querySelectorAll('.nombres').forEach((l) => { l.hidden = true; });
    document.querySelectorAll('[data-cuenta]').forEach((b) => b.setAttribute('aria-expanded', 'false'));
    id = crypto.randomUUID();
    inicio = null;
    sincronizar();
    marcarDia();
    mensaje('');
    $('#listo').hidden = true;
    $('#falta').hidden = false;
  }

  function pintar(d) {
    datos = d;
    $('#tipos').replaceChildren(...d.tipos.map((t) => ficha('radio', 'tipo', t)));
    $('#gravedades').replaceChildren(...d.gravedades.map((g) => ficha('radio', 'gravedad', g.gravedad, g.texto)));
    const porRol = new Map();
    d.personas.forEach((p) => porRol.set(p.rol, [...(porRol.get(p.rol) || []), p.nombre]));
    $('#grupos').replaceChildren(...[...porRol].map(([rol, nombres]) => grupo(rol, nombres)));
    $('#fecha').max = d.hoy;
    $('#cargando').hidden = true;
    nueva();
  }

  $('#afecta').addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'todos') casillas().forEach((c) => { c.checked = t.checked; });
    else if (t.dataset.grupo) casillas().filter((c) => c.dataset.de === t.dataset.grupo).forEach((c) => { c.checked = t.checked; });
    sincronizar();
  });

  document.querySelectorAll('[data-dia]').forEach((b) => b.addEventListener('click', () => {
    $('#fecha').value = datos[b.dataset.dia];
    marcarDia();
  }));
  $('#fecha').addEventListener('input', marcarDia);

  // Los segundos se cuentan desde que Marcos toca algo, no desde que abre la página.
  ['input', 'click'].forEach((ev) => $('#falta').addEventListener(ev, () => { inicio = inicio || Date.now(); }));

  $('#falta').addEventListener('submit', (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const entrada = {
      id,
      tipo: f.get('tipo'),
      gravedad: f.get('gravedad'),
      afecta: f.getAll('persona'),
      detalle: $('#detalle').value,
      fecha: $('#fecha').value,
      segundos: (Date.now() - inicio) / 1000,
    };
    $('#enviar').disabled = true;
    mensaje('Guardando…');
    google.script.run
      .withSuccessHandler((r) => {
        $('#enviar').disabled = false;
        if (r.error) return mensaje(r.error, true);
        $('#falta').hidden = true;
        $('#listo').hidden = false;
      })
      .withFailureHandler(() => {
        $('#enviar').disabled = false;
        mensaje('No hay conexión. Intenta de nuevo.', true);
      })
      .guardarFalta(entrada);
  });

  $('#otra').addEventListener('click', nueva);

  google.script.run
    .withSuccessHandler(pintar)
    .withFailureHandler(() => { $('#cargando').textContent = 'No se pudo cargar. Revisa la conexión y recarga la página.'; })
    .datosDePagina();
</script>
</body>
</html>
